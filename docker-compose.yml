version: "3.7"
services:
  ha-network-nginx:
    image: nginx:stable-alpine
    container_name: ha-network-nginx
    ports:
      - "80:80"
    volumes:
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d
      - ./src:/var/www/html
      - ./.docker/nginx/logs:/var/log/nginx
    networks:
      - ha-network

  ha-network-fpm:
    build:
      args:
        user: network-user
        uid: 1000
      context: .
      dockerfile: .docker/php-fpm/Dockerfile
    container_name: ha-network-fpm
    image: php:8.2
    restart: unless-stopped
    tty: true
    ports:
      - "9000:9000"
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html
    networks:
      - ha-network

  ha-network-postgres-master:
    image: postgres:16
    container_name: ha-network-postgres-master
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/postgres/data/master:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=network
    networks:
      - ha-network

  ha-network-postgres-slave1:
    image: postgres:16
    container_name: ha-network-postgres-slave1
    ports:
      - "5433:5432"
    volumes:
      - ./.docker/postgres/data/slave1:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=network
    networks:
      - ha-network

  ha-network-postgres-slave2:
    image: postgres:16
    container_name: ha-network-postgres-slave2
    ports:
      - "5434:5432"
    volumes:
      - ./.docker/postgres/data/slave2:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=network
    networks:
      - ha-network

networks:
  ha-network:
    driver: bridge